<svg xmlns="http://www.w3.org/2000/svg" width="758" height="739" viewBox="0 0 758 739" font-family="MesloLGS NF, monospace, 'Cascadia Mono', Consolas, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10" fill="#cad3f5">
<defs><clipPath id="win"><rect width="758" height="739" rx="8" ry="8"/></clipPath></defs><g clip-path="url(#win)">
<rect y="32" width="758" height="707" fill="#24273a"/>

<text y="58" xml:space="preserve"><tspan x="16" textLength="18" lengthAdjust="spacing" fill="#e1c682">mov</tspan><tspan x="34" textLength="6" lengthAdjust="spacing"> </tspan><tspan x="40" textLength="30" lengthAdjust="spacing" fill="#a5adcb">setup</tspan><tspan x="70" textLength="6" lengthAdjust="spacing"> </tspan><tspan x="76" textLength="30" lengthAdjust="spacing" fill="#5b6078">--aws</tspan><tspan x="106" textLength="6" lengthAdjust="spacing"> </tspan><tspan x="112" textLength="198" lengthAdjust="spacing" fill="#a5adcb">D:\MOV25\GitHub\aws\mov-workspace</tspan></text>
<text y="73" xml:space="preserve"><tspan x="16" textLength="24" lengthAdjust="spacing" fill="#eed49f" font-weight="bold">WARN</tspan><tspan x="40" textLength="702" lengthAdjust="spacing"> D:\MOV25\GitHub\aws\mov-workspace is inside the repository at D:\MOV25\GitHub\aws; `git clean` there would remove it</tspan></text>
<text y="103" xml:space="preserve"><tspan x="16" textLength="438" lengthAdjust="spacing" opacity="0.5">Naming tokens. Lower case letters and digits only, because they end up in</tspan></text>
<text y="118" xml:space="preserve"><tspan x="16" textLength="468" lengthAdjust="spacing" opacity="0.5">the names mov makes: `company` appears in all of them, and `user` in your own.</tspan></text>
<text y="148" xml:space="preserve"><tspan x="16" textLength="348" lengthAdjust="spacing" opacity="0.5">  company=acme user=dan  -&gt;  usr-acme-dan, grp-acme-admins</tspan></text>
<text y="163" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="90" lengthAdjust="spacing" font-weight="bold"> company token </tspan><tspan x="112" textLength="48" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">novatrix</tspan></text>
<text y="178" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="72" lengthAdjust="spacing" font-weight="bold"> user token </tspan><tspan x="94" textLength="30" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">sysop</tspan></text>
<text y="193" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="294" lengthAdjust="spacing" font-weight="bold"> The aws CLI profile the workspace signs in with </tspan><tspan x="316" textLength="78" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">mov-workspace</tspan></text>
<text y="208" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="252" lengthAdjust="spacing" font-weight="bold"> The IAM user mov makes for the workspace </tspan><tspan x="274" textLength="108" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">usr-novatrix-sysop</tspan></text>
<text y="223" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="258" lengthAdjust="spacing" font-weight="bold"> The IAM group that holds the admin policy </tspan><tspan x="280" textLength="114" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">grp-novatrix-admins</tspan></text>
<text y="253" xml:space="preserve"><tspan x="16" textLength="108" lengthAdjust="spacing" fill="#8bd5ca">Root signs in once</tspan><tspan x="124" textLength="564" lengthAdjust="spacing">, as mov-workspace-root: mov makes the workspace's own user with it, and signs root out again.</tspan></text>
<text y="268" xml:space="preserve"><tspan x="16" textLength="294" lengthAdjust="spacing">A browser window opens. Sign in as the account's </tspan><tspan x="310" textLength="54" lengthAdjust="spacing" fill="#8bd5ca">root user</tspan><tspan x="364" textLength="6" lengthAdjust="spacing">:</tspan></text>
<text y="283" xml:space="preserve"><tspan x="16" textLength="516" lengthAdjust="spacing">     choose Root user, then the account's email address, its password and the MFA code</tspan></text>
<text y="298" xml:space="preserve"><tspan x="16" textLength="30" lengthAdjust="spacing">     </tspan><tspan x="46" textLength="696" lengthAdjust="spacing" opacity="0.5">a browser still signed in to the console as root only asks you to allow access; this goes on by itself once you have</tspan></text>
<text y="313" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="486" lengthAdjust="spacing" font-weight="bold"> Root of AWS account ████████████ is signed in. Make the workspace's user there? </tspan><tspan x="508" textLength="18" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">Yes</tspan></text>
<text y="328" xml:space="preserve"><tspan x="16" textLength="426" lengthAdjust="spacing" opacity="0.5">signed in as arn:aws:iam::████████████:root on AWS account ████████████</tspan></text>
<text y="343" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="144" lengthAdjust="spacing" font-weight="bold"> The region mov acts in </tspan><tspan x="166" textLength="60" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">eu-north-1</tspan></text>
<text y="358" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="198" lengthAdjust="spacing">   made group grp-novatrix-admins</tspan></text>
<text y="373" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="300" lengthAdjust="spacing">   made AdministratorAccess on grp-novatrix-admins</tspan></text>
<text y="388" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="186" lengthAdjust="spacing">   made user usr-novatrix-sysop</tspan></text>
<text y="403" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="294" lengthAdjust="spacing">   made usr-novatrix-sysop in grp-novatrix-admins</tspan></text>
<text y="418" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="294" lengthAdjust="spacing">   made a console password for usr-novatrix-sysop</tspan></text>
<text y="448" xml:space="preserve"><tspan x="16" textLength="186" lengthAdjust="spacing" fill="#8bd5ca">Now usr-novatrix-sysop signs in</tspan><tspan x="202" textLength="90" lengthAdjust="spacing">, in two steps.</tspan></text>
<text y="463" xml:space="preserve"><tspan x="16" textLength="522" lengthAdjust="spacing">     1. In the console's sign-in page, sign out of root if it shows root, then sign in:</tspan></text>
<text y="478" xml:space="preserve"><tspan x="16" textLength="192" lengthAdjust="spacing">          account   ████████████</tspan></text>
<text y="493" xml:space="preserve"><tspan x="16" textLength="228" lengthAdjust="spacing">          user      usr-novatrix-sysop</tspan></text>
<text y="508" xml:space="preserve"><tspan x="16" textLength="264" lengthAdjust="spacing">          password  PZ*R9bs=L!8=g{A-pg)xUXP+</tspan></text>
<text y="523" xml:space="preserve"><tspan x="16" textLength="516" lengthAdjust="spacing">        That password works once: AWS asks for a new one, which is yours from then on.</tspan></text>
<text y="538" xml:space="preserve"><tspan x="16" textLength="6" lengthAdjust="spacing" fill="#5f819d">?</tspan><tspan x="22" textLength="204" lengthAdjust="spacing" font-weight="bold"> Open the console's sign-in page? </tspan><tspan x="226" textLength="18" lengthAdjust="spacing" fill="#ff9d00" font-weight="bold">Yes</tspan></text>
<text y="553" xml:space="preserve"><tspan x="16" textLength="30" lengthAdjust="spacing">     </tspan><tspan x="46" textLength="492" lengthAdjust="spacing" opacity="0.5">waiting for usr-novatrix-sysop to set a new password in the console (Ctrl+C stops)</tspan></text>
<text y="568" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="264" lengthAdjust="spacing">   usr-novatrix-sysop has set a new password</tspan></text>
<text y="583" xml:space="preserve"><tspan x="16" textLength="600" lengthAdjust="spacing">     2. Another browser window asks to let the CLI use that session: continue as usr-novatrix-sysop.</tspan></text>
<text y="598" xml:space="preserve"><tspan x="16" textLength="30" lengthAdjust="spacing">     </tspan><tspan x="46" textLength="216" lengthAdjust="spacing" opacity="0.5">this goes on by itself once you have</tspan></text>
<text y="613" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="282" lengthAdjust="spacing">   mov-workspace signs in as usr-novatrix-sysop</tspan></text>
<text y="628" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="660" lengthAdjust="spacing">   removed D:\MOV25\GitHub\aws\mov-workspace\keys\aws-usr-novatrix-sysop.password: the first password is spent</tspan></text>
<text y="643" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="366" lengthAdjust="spacing">   wrote D:\MOV25\GitHub\aws\mov-workspace\mov.workspace.json</tspan></text>
<text y="658" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="324" lengthAdjust="spacing">   wrote D:\MOV25\GitHub\aws\mov-workspace\naming.json</tspan></text>
<text y="673" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="378" lengthAdjust="spacing">   remembered in C:\Users\areli\AppData\Roaming\mov\config.json</tspan></text>
<text y="688" xml:space="preserve"><tspan x="16" textLength="12" lengthAdjust="spacing" fill="#a6da95" font-weight="bold">OK</tspan><tspan x="28" textLength="240" lengthAdjust="spacing">   signed root out of mov-workspace-root</tspan></text>
<text y="718" xml:space="preserve"><tspan x="16" textLength="96" lengthAdjust="spacing" fill="#8bd5ca">Workspace ready.</tspan><tspan x="112" textLength="534" lengthAdjust="spacing"> mov works as usr-novatrix-sysop from here; `mov check` says what the account looks like.</tspan></text>
<path d="M0 8 A 8 8 0 0 1 8 0 L 750 0 A 8 8 0 0 1 758 8 L 758 32 L 0 32 Z" fill="#181926"/><text x="16" y="16" fill="#cad3f5" font-size="12" opacity="0.75" text-anchor="start" dominant-baseline="central">pwsh</text><line x1="638" y1="16" x2="648" y2="16" stroke="#cad3f5" stroke-width="1" fill="none" opacity="0.9"/><rect x="684" y="11" width="10" height="10" stroke="#cad3f5" stroke-width="1" fill="none" opacity="0.9"/><path d="M730 11 L740 21 M740 11 L730 21" stroke="#cad3f5" stroke-width="1" fill="none" opacity="0.9"/>
</g>
</svg>